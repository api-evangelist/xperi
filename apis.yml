aid: xperi
name: Xperi
description: 'Xperi Inc. (NYSE: XPER) is an entertainment technology company whose
  licensed technologies power audio, video, and media discovery experiences across
  connected cars, consumer electronics, pay-TV, and streaming media platforms. Its
  brands include DTS immersive audio, HD Radio digital broadcast radio, IMAX Enhanced
  certification, and the TiVo video platform. Xperi ships its technologies to automakers,
  device makers, and video providers through commercial licensing and integration
  programs rather than a public developer API; no public developer portal or API
  documentation was found, though its TiVo engineering organization maintains an
  open-source presence on GitHub.'
